<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>weatherLab</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7fb; --card:#fff; --ink:#172033; --muted:#667085; --line:#d8deea; --ours:#396bd8; --market:#94a3b8; --edge:#16794a; --edge-bg:#e6f6ed; --warn:#a15c00; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui,-apple-system,"Noto Sans TC",sans-serif; overflow-wrap:anywhere; }
    main { width:min(1040px,100%); margin:auto; padding:22px 14px 48px; }
    header { margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(26px,5vw,38px); letter-spacing:-.03em; }
    h2 { margin:0 0 14px; font-size:20px; }
    .subtitle,.meta,.empty { color:var(--muted); }
    section { margin:14px 0; padding:18px; border:1px solid var(--line); border-radius:16px; background:var(--card); box-shadow:0 5px 18px #1720330b; }
    .market { padding:14px 0; border-top:1px solid var(--line); }
    .market:first-of-type { border-top:0; padding-top:0; }
    .market-title { display:flex; gap:8px; align-items:baseline; justify-content:space-between; flex-wrap:wrap; margin-bottom:9px; }
    .market-title strong { font-size:17px; }
    .bucket { display:grid; grid-template-columns:minmax(82px,1.1fr) minmax(0,2.6fr); gap:8px; padding:7px 8px; border-radius:9px; }
    .bucket.edge { background:var(--edge-bg); color:var(--edge); }
    .label { font-variant-numeric:tabular-nums; }
    .bars { display:grid; grid-template-columns:1fr 1fr; gap:7px; min-width:0; }
    .barbox { min-width:0; }
    .barlabel { display:flex; justify-content:space-between; gap:3px; color:var(--muted); font-size:11px; }
    .track { height:7px; border-radius:9px; background:var(--line); overflow:hidden; }
    .fill { height:100%; background:var(--ours); border-radius:inherit; }
    .fill.marketbar { background:var(--market); }
    .results { display:grid; gap:8px; }
    .result { display:grid; grid-template-columns:minmax(88px,1fr) minmax(0,2.4fr) auto; gap:8px; padding:10px 0; border-top:1px solid var(--line); align-items:center; }
    .result:first-child { border-top:0; }
    .badge { font-size:18px; }
    svg { display:block; width:100%; height:auto; max-height:300px; }
    .axis { stroke:var(--line); stroke-width:1; } .diagonal { stroke:var(--muted); stroke-dasharray:5 4; }
    .point { fill:var(--ours); opacity:.82; } .pnl { fill:none; stroke:var(--edge); stroke-width:3; vector-effect:non-scaling-stroke; }
    .chart-label { fill:var(--muted); font-size:11px; }
    @media (max-width:520px) { main{padding:14px 10px 34px} section{padding:14px;border-radius:12px}.bucket{grid-template-columns:1fr}.result{grid-template-columns:1fr auto}.result .detail{grid-column:1/-1;grid-row:2}.bars{gap:5px} }
    @media (prefers-color-scheme:dark) { :root { --bg:#0e1420; --card:#151d2b; --ink:#edf2fa; --muted:#9aa8bd; --line:#2d394b; --ours:#75a3ff; --market:#8c9bb0; --edge:#75d49e; --edge-bg:#143828; --warn:#ffc36b; } section{box-shadow:none} }
  </style>
</head>
<body>
<main>
  <header><h1>weatherLab</h1><div class="subtitle">Ensemble 預報 × Polymarket 天氣市場</div></header>
  <section><h2>今天 / 明天</h2><div id="forecasts" class="empty">讀取中…</div></section>
  <section><h2>最近結算</h2><div id="results" class="empty">讀取中…</div></section>
  <section><h2>校準圖</h2><div id="calibration" class="empty">讀取中…</div></section>
  <section><h2>紙上交易累計損益</h2><div id="pnl" class="empty">讀取中…</div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const NAMES = {nyc:'紐約 LGA',london:'倫敦 LCY','hong-kong':'香港 天文台',miami:'邁阿密 MIA'};
const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = value => value == null ? '—' : `${Math.round(Math.max(.001,Math.min(.999,value))*100)}%`;
const cache = `?t=${Date.now()}`;
async function load(path, fallback) { try { const r=await fetch(path+cache); if(!r.ok) throw Error(r.status); return await r.json(); } catch(e) { return fallback; } }
function dateInZone(iso,tz) { const parts=new Intl.DateTimeFormat('en',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(iso)); const get=t=>parts.find(p=>p.type===t)?.value; return `${get('year')}-${get('month')}-${get('day')}`; }
function addDay(day) { const d=new Date(`${day}T12:00:00Z`); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); }

function renderForecasts(latest) {
  const root=$('forecasts'), all=Array.isArray(latest.snapshots)?latest.snapshots:[];
  const shown=all.filter(s=>{const today=dateInZone(latest.generated_at,s.tz);return s.target_date===today||s.target_date===addDay(today)}).sort((a,b)=>a.target_date.localeCompare(b.target_date)||a.market.localeCompare(b.market));
  if(!shown.length){root.className='empty';root.textContent='還沒有資料';return}
  root.className=''; root.innerHTML=shown.map(s=>`<div class="market"><div class="market-title"><strong>${esc(s.market_name)} · ${esc(s.target_date)}</strong><span class="meta">${s.target_date>dateInZone(latest.generated_at,s.tz)?'':'當地今天・不下單 · '}bias ${Number(s.bias).toFixed(1)}°${esc(s.unit)} · ${esc(s.n_members)} members · 只列 ≥1% 的格子</span></div>${(s.buckets||[]).filter(b=>b.p>=.01||b.mid>=.01).map(b=>{const edge=s.target_date>dateInZone(latest.generated_at,s.tz)&&b.best_ask!=null&&b.best_ask>=.10&&b.best_ask<=.85&&b.p-b.best_ask>=.08;return `<div class="bucket${edge?' edge':''}"><div class="label">${esc(b.label)}${edge?' · edge '+pct(b.p-b.best_ask):''}</div><div class="bars"><div class="barbox"><div class="barlabel"><span>我們</span><span>${pct(b.p)}</span></div><div class="track"><div class="fill" style="width:${Math.max(.1,Math.min(99.9,b.p*100))}%"></div></div></div><div class="barbox"><div class="barlabel"><span>市價</span><span>${pct(b.mid)}</span></div><div class="track"><div class="fill marketbar" style="width:${Math.max(.1,Math.min(99.9,b.mid*100))}%"></div></div></div></div></div>`}).join('')}</div>`).join('')+`<div class="meta">快照 ${esc(latest.generated_at||'—')}</div>`;
}
function renderResults(rows,pending) {
  const root=$('results'), ordered=(Array.isArray(rows)?rows:[]).sort((a,b)=>b.target_date.localeCompare(a.target_date)), dates=[...new Set(ordered.map(r=>r.target_date))].slice(0,7), settled=ordered.filter(r=>dates.includes(r.target_date));
  const waits=Array.isArray(pending)?pending:[];
  if(!settled.length&&!waits.length){root.className='empty';root.textContent='還沒有資料';return}
  root.className='results'; root.innerHTML=settled.map(r=>`<div class="result"><strong>${esc(NAMES[r.market]||r.market)} · ${esc(r.target_date)}</strong><div class="detail">實測 ${esc(r.obs_value)}° → ${esc(r.our_bucket)} · 我們 ${pct(r.p_of_actual)}</div><span class="badge">${r.hit==null?'⏳':r.hit?'✅':'❌'}</span></div>`).join('')+waits.map(r=>`<div class="result"><strong>${esc(NAMES[r.market]||r.market)} · ${esc(r.target_date)}</strong><div class="detail">${esc(r.reason)}</div><span class="badge">⏳</span></div>`).join('');
}
function chartFrame(content,x='預測機率',y='實際命中率'){return `<svg viewBox="0 0 620 290" role="img"><line class="axis" x1="54" y1="240" x2="590" y2="240"/><line class="axis" x1="54" y1="25" x2="54" y2="240"/>${content}<text class="chart-label" x="500" y="270">${x}</text><text class="chart-label" x="8" y="18">${y}</text></svg>`}
function renderCalibration(summary) {
  const root=$('calibration'), bins=Array.isArray(summary.calibration)?summary.calibration.filter(b=>b.n):[];
  if(!bins.length){root.className='empty';root.textContent='還沒有資料';return}
  const points=bins.map(b=>{const x=54+b.avg_p*536,y=240-b.hit_rate*215,r=Math.min(16,3+Math.sqrt(b.n));return `<circle class="point" cx="${x}" cy="${y}" r="${r}"><title>n=${b.n}, 預測 ${pct(b.avg_p)}, 命中 ${pct(b.hit_rate)}</title></circle>`}).join('');
  const note=(summary.all?.n||0)<30?'<div class="meta">樣本不足（少於 30 個已評分日）</div>':'';
  root.className='';root.innerHTML=chartFrame('<line class="diagonal" x1="54" y1="240" x2="590" y2="25"/>'+points)+note;
}
function renderPnl(summary) {
  const root=$('pnl'), series=summary.paper?.series||[];
  if(!series.length){root.className='empty';root.textContent='還沒有資料';return}
  const values=series.map(d=>Number(d.pnl)),min=Math.min(0,...values),max=Math.max(0,...values),span=max-min||1;
  const points=series.map((d,i)=>`${54+(series.length===1?.5:i/(series.length-1))*536},${240-(Number(d.pnl)-min)/span*200}`).join(' ');
  root.className='';root.innerHTML=chartFrame(`<polyline class="pnl" points="${points}"/>`,'日期',`損益 $（${min.toFixed(0)}～${max.toFixed(0)}）`)+`<div class="meta">${series.length} 個結算日 · 累計 $${Number(summary.paper.pnl||0).toFixed(2)}</div>`;
}

Promise.all([load('data/latest.json',{}),load('data/results.json',[]),load('data/summary.json',{})]).then(([latest,results,summary])=>{renderForecasts(latest);renderResults(results,latest.pending);renderCalibration(summary);renderPnl(summary)});
</script>
</body>
</html>

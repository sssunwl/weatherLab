name: weatherLab v2

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      notify:
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: weatherlab-v2
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependency
        run: pip install requests
      - name: Run weatherLab
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [[ "${{ github.event.schedule }}" == "0 0 * * *" || "${{ inputs.notify }}" == "true" ]]; then
            python -m lab.run --notify
          else
            python -m lab.run
          fi
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update weatherLab data"
          for attempt in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
